[project]
name = "tinygrad-dx12"
version = "0.1.0"
description = "Standalone Direct3D 12 compute backend for tinygrad"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["tinygrad @ git+https://github.com/tinygrad/tinygrad.git"]

[project.scripts]
tinygrad-dx12 = "tinygrad_dx12:main"
update-tinygrad-spec = "tinygrad_dx12.update_tinygrad_spec:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff", "pyrefly", "pytest", "pytest-xdist", "pytest-split", "numpy"]
upstream-tests = ["torch", "hypothesis", "scipy", "pillow"]

# Adapted from tinygrad's pyproject.toml (master).
[tool.pytest.ini_options]
norecursedirs = ["extra", ".hypothesis", ".git"]
testpaths = ["test"]
filterwarnings = [
  # Ignore SWIG warnings from importlib
  "ignore:builtin type SwigPy.*has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
  # Ignore torch.distributed deprecation warning
  "ignore:.*torch.distributed.reduce_op.*is deprecated:FutureWarning",
  # Ignore numpy warnings from transcendental tests (testing edge cases)
  "ignore:invalid value encountered in log2:RuntimeWarning",
  "ignore:overflow encountered in cast:RuntimeWarning",
  "ignore:divide by zero encountered in log2:RuntimeWarning",
  # Ignore multiprocessing fork warning (known pytest-xdist issue)
  "ignore:.*multi-threaded, use of fork.*may lead to deadlocks:DeprecationWarning",
  # Ignore torch tar extraction warning
  "ignore:.*Python 3.14 will.*filter extracted tar archives:DeprecationWarning",
  # Ignore audio library warnings (Python 3.13 removed aifc and sunau)
  "ignore:aifc was removed in Python 3.13.*:DeprecationWarning",
  "ignore:sunau was removed in Python 3.13.*:DeprecationWarning",
]

[tool.ruff]
preview = true
target-version = "py314"
line-length = 150
indent-width = 4
extend-exclude = [
  ".git/",
  "tinygrad_spec/",
  "docs/",
  "extra/",
  "test/external/mlperf_resnet",
  "test/external/mlperf_unet3d",
]

[tool.ruff.lint]
select = [
  "F",    # Pyflakes
  "W6",
  "E71",
  "E72",
  "E112", # no-indented-block
  "E113", # unexpected-indentation
  "E203", # whitespace-before-punctuation
  "E272", # multiple-spaces-before-keyword
  "E275", # missing-whitespace-after-keyword
  "E303", # too-many-blank-lines
  "E304", # blank-line-after-decorator
  "E501", # line-too-long
  # "E502",
  "E702",    # multiple-statements-on-one-line-semicolon
  "E703",    # useless-semicolon
  "E731",    # lambda-assignment
  "W191",    # tab-indentation
  "W291",    # trailing-whitespace
  "W293",    # blank-line-with-whitespace
  "UP039",   # unnecessary-class-parentheses
  "C416",    # unnecessary-comprehension
  "RET506",  # superfluous-else-raise
  "RET507",  # superfluous-else-continue
  "A",       # builtin-variable-shadowing, builtin-argument-shadowing, builtin-attribute-shadowing
  "FURB110", # if-exp-instead-of-or-operator
  "RUF018",  # assignment-in-assert
]

# detect unused imports in examples
[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = [
  "W6",
  "E71",
  "E72",
  "E112",
  "E113",
  "E203",
  "E272",
  "E275",
  "E303",
  "E304",
  "E501",
  "E702",
  "E703",
  "E731",
  "W191",
  "W291",
  "W293",
  "UP039",
  "C416",
  "RET506",
  "RET507",
  "A",
  "FURB110",
  "RUF018",
  "F541",
  "F841",
]
"src/tinygrad_dx12/runtime/autogen/**/*.py" = [
  "E501",
  "F401",
  "E731",
  "F821",
  "A006",
  "A002",
  "F811",
  "F822",
]

[tool.ruff.format]
indent-style = "space"

[tool.pyrefly]
project-includes = ["src/**/*.py"]
search-path = ["src", "."]
python-version = "3.14"
check-unannotated-defs = true
ignore-missing-imports = ["*"]
replace-imports-with-any = ["extra.*"]

[tool.pyrefly.errors]
redundant-cast = true
unreachable = true
incompatible-comparison = true
